# Experiment configuration — defaults audited from the upstream code and paper.
# Every value traces to docs/EXPERIMENT_PROTOCOL.md; see docs/REPOSITORY_DESIGN.md §5.
experiment:
  name: rq_replication
  seed: 42

dataset:
  name: RQ
  file: data/raw/RQ.csv
  text_column: question_with_context

model:
  checkpoint: Qwen/Qwen3-4B
  revision: 1cfa9a7208912126459214e8b04321603b3df60c  # verified stable 2026-11-01..04; printed by the Colab smoke test
  dtype: float16          # T4 has no bf16; upstream "auto" would load bf16 there
  device: auto

representation:
  pooling: last_token     # second run: mean_token (attention-mask weighted)
  batch_size: 16          # confirm with the Colab pilot batch sweep
  max_length: 512
  shard_every: 500        # partial-checkpoint frequency (resume support)

pca:
  n_components: 64        # paper §3.2 / Fig. 1
  fit_split: all          # 'all' = published protocol; 'train' = leakage-controlled variant
